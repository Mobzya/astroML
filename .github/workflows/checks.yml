name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,physics-check]'
      - run: python -m ruff check src scripts tests
      - run: python -m pytest -q
      - run: python scripts/smoke.py --output artifacts/ci-smoke
      - run: python scripts/verify_smoke.py artifacts/ci-smoke
      - run: python scripts/check_physics_literature.py --output artifacts/physics-literature-check.json
